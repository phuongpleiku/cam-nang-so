<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Khai sinh: phân biệt người làm và người được khai sinh</title><desc id="desc">Sơ đồ minh họa để nhận biết thông tin. Không phải giấy tờ thật, biểu mẫu nộp hồ sơ hoặc ảnh giao diện cổng nhà nước.</desc><rect width="1000" height="660" rx="24" fill="#edf4ef"/><g font-family="Arial, sans-serif"><text x="40" y="43" fill="#126449" font-size="15" font-weight="700">CẨM NANG SỐ  /  NHÌN MẪU ĐỂ DỄ HIỂU</text><text x="40" y="86" fill="#153f31" font-size="29" font-weight="700">Khai sinh: phân biệt người làm và người được khai sinh</text><text x="40" y="125" fill="#52665d" font-size="19" font-weight="400">Ví dụ: mẹ đứng tên làm thủ tục cho con.</text><rect x="40" y="165" width="438" height="335" rx="16" fill="white" stroke="#ccddd2"/><rect x="40" y="165" width="438" height="9" rx="4" fill="#126449"/><circle cx="77" cy="213" r="18" fill="#e6f1e9"/><text x="71" y="220" fill="#126449" font-size="20" font-weight="700">1</text><text x="64" y="270" fill="#153f31" font-size="24" font-weight="700">NGƯỜI YÊU CẦU</text><line x1="64" y1="325" x2="454" y2="325" stroke="#dce7df"/><text x="64" y="363" fill="#52665d" font-size="19" font-weight="400">Điền thông tin của mẹ</text><text x="64" y="393" fill="#52665d" font-size="19" font-weight="400">khi mẹ đứng tên yêu cầu.</text><rect x="64" y="440" width="390" height="36" rx="7" fill="#f0f5f2"/><text x="76" y="464" fill="#126449" font-size="16" font-weight="700">Người đi làm thủ tục</text><rect x="500" y="165" width="438" height="335" rx="16" fill="white" stroke="#ccddd2"/><rect x="500" y="165" width="438" height="9" rx="4" fill="#496b80"/><circle cx="537" cy="213" r="18" fill="#e6f1e9"/><text x="531" y="220" fill="#126449" font-size="20" font-weight="700">2</text><text x="524" y="270" fill="#153f31" font-size="24" font-weight="700">NGƯỜI ĐƯỢC KHAI SINH</text><line x1="524" y1="325" x2="914" y2="325" stroke="#dce7df"/><text x="524" y="363" fill="#52665d" font-size="19" font-weight="400">Điền thông tin của bé,</text><text x="524" y="393" fill="#52665d" font-size="19" font-weight="400">đối chiếu giấy chứng sinh.</text><rect x="524" y="440" width="390" height="36" rx="7" fill="#f0f5f2"/><text x="536" y="464" fill="#126449" font-size="16" font-weight="700">Bé được đăng ký khai sinh</text><text x="40" y="551" fill="#153f31" font-size="23" font-weight="700">Mỗi phần lấy thông tin của đúng người được nhắc đến.</text><text x="40" y="583" fill="#52665d" font-size="18" font-weight="400">Đây là sơ đồ giải thích vai trò, không phải ảnh chụp tờ khai trên cổng.</text><line x1="40" y1="608" x2="960" y2="608" stroke="#ccddd2"/><text x="40" y="638" fill="#52665d" font-size="17" font-weight="400">SƠ ĐỒ MINH HỌA · Vị trí trên giấy thực tế có thể khác. Không dùng để nộp hồ sơ.</text></g></svg>

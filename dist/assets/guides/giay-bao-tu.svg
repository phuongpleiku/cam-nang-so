<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">Giấy báo tử: kiểm tra trước khi kê khai</title><desc id="desc">Sơ đồ minh họa để nhận biết thông tin. Không phải giấy tờ thật, biểu mẫu nộp hồ sơ hoặc ảnh giao diện cổng nhà nước.</desc><rect width="1000" height="660" rx="24" fill="#edf4ef"/><g font-family="Arial, sans-serif"><text x="40" y="43" fill="#126449" font-size="15" font-weight="700">CẨM NANG SỐ  /  NHÌN MẪU ĐỂ DỄ HIỂU</text><text x="40" y="86" fill="#153f31" font-size="29" font-weight="700">Giấy báo tử: kiểm tra trước khi kê khai</text><rect x="40" y="118" width="475" height="466" rx="14" fill="white" stroke="#cdded2"/><rect x="60" y="140" width="130" height="28" rx="6" fill="#e9f3ed"/><text x="74" y="160" fill="#126449" font-size="13" font-weight="700">MẪU MINH HỌA</text><text x="76" y="206" fill="#153f31" font-size="26" font-weight="700">GIẤY BÁO TỬ</text><text x="76" y="235" fill="#66796f" font-size="17" font-weight="400">Đối chiếu trên giấy tờ của gia đình</text><rect x="66" y="263" width="423" height="77" rx="9" fill="#f3f8f4" stroke="#7fae92"/><text x="84" y="291" fill="#28483b" font-size="19" font-weight="700">Thông tin người đã mất</text><text x="84" y="319" fill="#66796f" font-size="17" font-weight="400">Họ tên và thông tin định danh</text><circle cx="493" cy="301" r="17" fill="#126449"/><text x="487" y="308" fill="white" font-size="18" font-weight="700">1</text><path d="M512 301H545" stroke="#8bae99" stroke-width="2" stroke-dasharray="5 5"/><text x="565" y="288" fill="#153f31" font-size="21" font-weight="700">1. Đúng người được khai tử</text><text x="565" y="318" fill="#52665d" font-size="18" font-weight="400">Không điền thông tin người làm thay.</text><rect x="66" y="357" width="423" height="77" rx="9" fill="#f3f8f4" stroke="#7fae92"/><text x="84" y="385" fill="#28483b" font-size="19" font-weight="700">Thông tin qua đời</text><text x="84" y="413" fill="#66796f" font-size="17" font-weight="400">Thời điểm · nơi qua đời</text><circle cx="493" cy="395" r="17" fill="#126449"/><text x="487" y="402" fill="white" font-size="18" font-weight="700">2</text><path d="M512 395H545" stroke="#8bae99" stroke-width="2" stroke-dasharray="5 5"/><text x="565" y="382" fill="#153f31" font-size="21" font-weight="700">2. Đối chiếu thời điểm, địa điểm</text><text x="565" y="412" fill="#52665d" font-size="18" font-weight="400">Chưa rõ thì hỏi lại cơ quan tiếp nhận.</text><rect x="66" y="451" width="423" height="77" rx="9" fill="#f3f8f4" stroke="#7fae92"/><text x="84" y="479" fill="#28483b" font-size="19" font-weight="700">Thông tin cấp giấy</text><text x="84" y="507" fill="#66796f" font-size="17" font-weight="400">Đơn vị cấp và thông tin trên giấy</text><circle cx="493" cy="489" r="17" fill="#126449"/><text x="487" y="496" fill="white" font-size="18" font-weight="700">3</text><path d="M512 489H545" stroke="#8bae99" stroke-width="2" stroke-dasharray="5 5"/><text x="565" y="476" fill="#153f31" font-size="21" font-weight="700">3. Kiểm tra giấy tờ đang có</text><text x="565" y="506" fill="#52665d" font-size="18" font-weight="400">Giấy thay thế cần được xác định</text><text x="565" y="536" fill="#52665d" font-size="18" font-weight="400">theo trường hợp của gia đình.</text><line x1="40" y1="608" x2="960" y2="608" stroke="#ccddd2"/><text x="40" y="638" fill="#52665d" font-size="17" font-weight="400">SƠ ĐỒ MINH HỌA · Vị trí trên giấy thực tế có thể khác. Không dùng để nộp hồ sơ.</text></g></svg>
